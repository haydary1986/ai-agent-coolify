<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الوكيل الذكي (AI Agent)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #f8fafc;
        }
        .chat-container {
            width: 100%;
            max-width: 800px;
            background: #1e293b;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            height: 90vh;
            border: 1px solid #334155;
            position: relative;
        }
        .header {
            background: #3b82f6;
            color: white;
            padding: 20px;
            border-top-left-radius: 16px;
            border-top-right-radius: 16px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .session-info {
            font-size: 0.9rem;
            font-weight: normal;
            opacity: 0.8;
        }
        .messages {
            flex-grow: 1;
            padding: 25px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .message {
            max-width: 85%;
            padding: 15px 20px;
            border-radius: 16px;
            line-height: 1.6;
            font-size: 1.05rem;
        }
        .user-message {
            background: #3b82f6;
            color: white;
            align-self: flex-start;
            border-bottom-right-radius: 4px;
        }
        .bot-message {
            background: #334155;
            color: #f8fafc;
            align-self: flex-end;
            border-bottom-left-radius: 4px;
            border: 1px solid #475569;
        }
        .input-area {
            display: flex;
            padding: 20px;
            border-top: 1px solid #334155;
            background: #1e293b;
            border-bottom-left-radius: 16px;
            border-bottom-right-radius: 16px;
            gap: 15px;
        }
        input[type="text"], input[type="password"] {
            flex-grow: 1;
            padding: 15px;
            border: 1px solid #475569;
            border-radius: 12px;
            font-size: 1.1rem;
            outline: none;
            background: #0f172a;
            color: white;
            transition: border-color 0.3s;
        }
        input[type="password"] {
            flex-grow: 0;
            width: 150px;
        }
        input:focus {
            border-color: #3b82f6;
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 0 30px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: bold;
            transition: background 0.3s, transform 0.1s;
        }
        button:hover {
            background: #2563eb;
        }
        button:active {
            transform: scale(0.98);
        }
        .loading {
            font-style: italic;
            color: #94a3b8;
            font-size: 0.95rem;
            align-self: flex-end;
            display: none;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">
        <span>مساعدك البرمجي (AI Agent)</span>
        <span class="session-info">الجلسة الحالية: <span id="sessionIdDisplay"></span></span>
    </div>
    <div class="messages" id="messages">
        <div class="message bot-message">مرحباً! أنا الوكيل الذكي الخاص بك. يرجى إدخال كلمة المرور في الأسفل لبدء المحادثة، حيث أمتلك الآن ذاكرة للمحادثات السابقة!</div>
    </div>
    <div class="loading" id="loading">جاري التفكير وجمع المعلومات...</div>
    <div class="input-area">
        <input type="password" id="passwordInput" placeholder="كلمة المرور">
        <input type="text" id="userInput" placeholder="اكتب طلبك أو سؤالك هنا..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">إرسال</button>
    </div>
</div>

<script>
    const messagesDiv = document.getElementById('messages');
    const userInput = document.getElementById('userInput');
    const passwordInput = document.getElementById('passwordInput');
    const loadingDiv = document.getElementById('loading');
    
    // إنشاء رقم جلسة عشوائي أو قراءته من التخزين المحلي لضمان استمرار الذاكرة
    let sessionId = localStorage.getItem('agent_session_id');
    if (!sessionId) {
        sessionId = 'session_' + Math.random().toString(36).substring(2, 10);
        localStorage.setItem('agent_session_id', sessionId);
    }
    document.getElementById('sessionIdDisplay').innerText = sessionId;

    // محاولة استرجاع كلمة المرور المحفوظة
    const savedPassword = localStorage.getItem('agent_password');
    if (savedPassword) {
        passwordInput.value = savedPassword;
    }

    function formatText(text) {
        let formatted = text.replace(/```([\s\S]*?)```/g, '<pre style="background:#0f172a; padding:15px; border-radius:8px; overflow-x:auto; direction:ltr; text-align:left;"><code>$1</code></pre>');
        formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
        return formatted.replace(/\n/g, '<br>');
    }

    function appendMessage(sender, text) {
        const msgDiv = document.createElement('div');
        msgDiv.classList.add('message');
        msgDiv.classList.add(sender === 'user' ? 'user-message' : 'bot-message');
        msgDiv.innerHTML = formatText(text);
        messagesDiv.appendChild(msgDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        const password = passwordInput.value;
        
        if (!text) return;
        if (!password) {
            alert('يرجى إدخال كلمة المرور');
            return;
        }

        // حفظ كلمة المرور لتسهيل الاستخدام
        localStorage.setItem('agent_password', password);

        appendMessage('user', text);
        userInput.value = '';
        loadingDiv.style.display = 'block';
        messagesDiv.scrollTop = messagesDiv.scrollHeight;

        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    message: text,
                    password: password,
                    session_id: sessionId
                })
            });
            const data = await response.json();
            
            if (response.ok) {
                appendMessage('bot', data.response);
            } else {
                appendMessage('bot', '❌ خطأ: ' + (data.detail || 'حدث خطأ غير معروف'));
            }
        } catch (error) {
            appendMessage('bot', '❌ خطأ في الاتصال بالخادم: ' + error.message);
        } finally {
            loadingDiv.style.display = 'none';
        }
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    }
</script>

</body>
</html>
